services:
  banorte-api:
    # Suggestion for multiple workers for avoiding chat shared 
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --no-access-log

    environment:
      APP_ENV: production

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

    # Evitar — suggest: use reverse proxy (nginx, traefik)
    ports: []
    expose:
      - "8000"