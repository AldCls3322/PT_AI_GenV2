services:

  # MAIN
  banorte-api:
    build:
      context: .
      dockerfile: Dockerfile
      # El target apunta al stage final del multi-stage build
      target: runtime

    container_name: banorte-assistant

    # ENV VARIABLES
    env_file:
      - .env
    environment:
      # LLM
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

      # RAG ChromaDB 
      CHROMA_PERSIST_DIR: /app/chroma_store
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-banorte_docs}
      CHUNK_SIZE: ${CHUNK_SIZE:-500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-50}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
      TOP_K: ${TOP_K:-4}
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-1.0}

      # db
      DATABASE_URL: sqlite:////app/data/banorte.db

      # When running run py, some wraning show for the package version, it can be muted:
      ANONYMIZED_TELEMETRY: "False"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
      HF_HOME: /app/.cache/huggingface
      TRANSFORMERS_CACHE: /app/.cache/huggingface

    ports:
      - "${APP_PORT:-8000}:8000"

    # Avoid loosing db
    volumes:
      # ChromaDB — vectores y embeddings
      - chroma-data:/app/chroma_store
      # SQLite — base de datos relacional
      - banorte-data:/app/data
      # modelos HuggingFace
      - hf-cache:/app/.cache/huggingface
      # Documentos RAG
      - ./docs:/app/docs:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 4G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 1G

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# volumenes db para no perderlos al reiniciar el contenedor
volumes:
  chroma-data:
    name: banorte-assistant_chroma-data
  banorte-data:
    name: banorte-assistant_banorte-data
  hf-cache:
    name: banorte-assistant_hf-cache